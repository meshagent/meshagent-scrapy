[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-scrapy"
description = "Scrapy spider imports for Meshagent datasets"
dynamic = ["version", "readme"]
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "html-to-markdown~=2.24.3",
  "jmespath~=1.0",
  "pytest~=8.4",
  "pytest-asyncio~=0.26",
  "meshagent-api==0.51.3",
  "pyarrow~=21.0.0",
  "scrapy~=2.13",
  "trafilatura~=2.0",
]

[project.urls]
Documentation = "https://docs.meshagent.com"
Website = "https://www.meshagent.com"
Source = "https://www.meshagent.com"

[tool.setuptools.packages.find]
include = ["meshagent.*"]

[tool.setuptools.package-data]
"meshagent.scrapy" = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.setuptools.dynamic]
version = {attr = "meshagent.scrapy.version.__version__"}
readme = { file = "README.md", content-type = "text/markdown" }
